# Wöchentliches Datenbank-Backup des Supabase-Projekts.
#
# Erstellt einen SQL-Dump (Schema + Daten + Rollen) und lädt ihn als
# Workflow-Artifact hoch (Retention 90 Tage). Zusätzlich wird geprüft,
# dass der Dump nicht leer/korrupt ist.
#
# Erforderliche Secrets im GitHub-Repo (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_PASSWORD – Datenbank-Passwort des Projekts
#     (Supabase Dashboard → Settings → Database → Database password)
#
# Manueller Start jederzeit über "Run workflow" (workflow_dispatch).

name: Supabase Backup

on:
  schedule:
    # Jeden Sonntag 03:30 UTC (= 05:30 Sommerzeit / 04:30 Winterzeit MEZ)
    - cron: '30 3 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase CLI installieren
        run: npx --yes supabase@latest --version

      - name: Dump erstellen (Rollen + Schema + Daten, getrennt)
        env:
          # Projekt-Ref fest verdrahtet; Passwort ausschließlich aus Secret
          SUPABASE_DB_URL: "postgresql://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@db.fnebocricgzjwmzalozr.supabase.co:5432/postgres"
        run: |
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          PREFIX="parfum-backup-${STAMP}"
          # Offiziell empfohlenes Drei-Wege-Dump (Supabase-Doku):
          # 1) Rollen (Berechtigungen), 2) Schema, 3) Daten
          npx supabase@latest db dump \
            --db-url "$SUPABASE_DB_URL" \
            --file "${PREFIX}-roles.sql" \
            --role-only
          npx supabase@latest db dump \
            --db-url "$SUPABASE_DB_URL" \
            --file "${PREFIX}-schema.sql"
          npx supabase@latest db dump \
            --db-url "$SUPABASE_DB_URL" \
            --file "${PREFIX}-data.sql" \
            --data-only \
            --use-copy
          # Alle Dumps gzip-komprimieren (SQL-Dumps sind stark komprimierbar)
          gzip "${PREFIX}-roles.sql" "${PREFIX}-schema.sql" "${PREFIX}-data.sql"
          tar -czf "${PREFIX}.tar.gz" "${PREFIX}-roles.sql.gz" "${PREFIX}-schema.sql.gz" "${PREFIX}-data.sql.gz"
          echo "BACKUP_FILE=${PREFIX}.tar.gz" >> "$GITHUB_ENV"

      - name: Dump-Integrität prüfen
        run: |
          test -s "$BACKUP_FILE" || { echo "::error::Backup-Datei fehlt oder ist leer"; exit 1; }
          tar -tzf "$BACKUP_FILE" > /dev/null || { echo "::error::Tar/Gzip-Integritätsprüfung fehlgeschlagen"; exit 1; }
          # Prüfen, dass der Daten-Dump nicht leer ist (mindestens 1 Datenzeile)
          tar -xzf "$BACKUP_FILE" -O "$(basename "${BACKUP_FILE%.tar.gz}")-data.sql.gz" | gzip -dc | head -50 > /tmp/data-head.txt
          if ! grep -q "COPY\|INSERT" /tmp/data-head.txt; then
            echo "::warning::Daten-Dump enthält keine COPY/INSERT-Anweisungen (leere Sammlung?)"
          fi
          echo "Backup OK: $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"

      - name: Backup als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error
