<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Safari Animations-Diagnose</title>
<style>
  body { font-family: -apple-system, sans-serif; padding: 24px; background: #FAFAF8; }
  .box { width: 120px; height: 120px; background: #534AB7; border-radius: 12px; margin: 16px 0; }
  @keyframes testSpin {
    0% { transform: rotateY(-180deg) scale(.55); opacity: 0; }
    100% { transform: rotateY(0deg) scale(1); opacity: 1; }
  }
  @keyframes testFade {
    0% { opacity: 0; transform: scale(.5); }
    100% { opacity: 1; transform: scale(1); }
  }
  .spin { animation: testSpin 2s cubic-bezier(.35,.9,.25,1) both; }
  .fade { animation: testFade 1s ease-out both; }
  button { margin: 6px 6px 6px 0; padding: 8px 16px; }
  pre { background: #eee; padding: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>Safari Animations-Diagnose</h1>
  <p>Klicke auf „Test starten" – die blaue Box soll sich über 2 Sekunden drehend einfaden.</p>
  <button onclick="start()">Test starten</button>
  <button onclick="location.reload()">Zurücksetzen</button>
  <div id="spinBox" class="box"></div>
  <pre id="out">–</pre>
  <script>
    // Diagnose: reduziert Safari die Bewegung (macOS "Bewegung reduzieren")?
    const rm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.getElementById("out").textContent =
      "prefers-reduced-motion: reduce = " + rm + "\\n" +
      (rm ? "→ macOS 'Bewegung reduzieren' ist AKTIV. Das ist sehr wahrscheinlich die Ursache: Systemeinstellungen → Bedienungshilfen → Anzeige → Bewegung reduzieren (ausschalten)."
          : "→ Kein Reduce-Motion erkannt. Wenn die Box trotzdem nicht animiert, liegt ein Safari-spezifisches Problem vor.");
    function start() {
      const b = document.getElementById("spinBox");
      b.classList.remove("spin", "fade");
      void b.offsetWidth; // Reflow, damit die Animation neu startet
      b.classList.add("spin");
    }
  </script>
</body>
</html>
