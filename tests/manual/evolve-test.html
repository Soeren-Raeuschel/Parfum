<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EvolveCard Safari-Diagnose</title>
<style>
  body { font-family: Georgia, serif; }
  button { margin: 8px; padding: 10px 18px; font-size: 14px; }
  #log { font: 12px/1.6 monospace; background: #f1efe8; padding: 12px; white-space: pre-wrap; }

  /* Baugleiche Struktur wie EvolveCard.jsx (Inline-Styles 1:1 übernommen) */
  .overlay {
    position: fixed; inset: 0; z-index: 9500;
    background: rgba(26,26,24,.55);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
  }
  .overlay.noblur { -webkit-backdrop-filter: none; backdrop-filter: none; }
  .persp { position: relative; perspective: 900px; }
  .star { position: absolute; left: 50%; top: 0; pointer-events: none;
    animation: starBurst 1.1s cubic-bezier(.22,1,.36,1) 950ms both; }
  .shadow { position: absolute; inset: 0; border-radius: 18px;
    background: rgba(26,26,24,.45); filter: blur(18px);
    pointer-events: none; z-index: 0;
    animation: cardShadowIn 1.4s cubic-bezier(.35,.9,.25,1) both; }
  .card { position: relative; z-index: 1; width: 216px; min-height: 300px;
    border-radius: 18px; padding: 18px;
    background: linear-gradient(155deg, #534AB7 0%, #7C6FE0 55%, #4A429E 100%);
    color: #FAFAF8; box-shadow: 0 20px 50px rgba(26,26,24,.45);
    font-family: Georgia, serif; will-change: transform, opacity; overflow: hidden; }
  .card.reduced { animation: scaleIn .2s ease-out both; }
  .card.d3 { transform-style: preserve-3d; animation: cardSpinIn 1.4s cubic-bezier(.35,.9,.25,1) both; }
  .card.d2 { animation: cardSpinIn2D 1.4s cubic-bezier(.35,.9,.25,1) both; }
  .shine { position: absolute; top: 0; bottom: 0; left: 0; width: 45%;
    background: linear-gradient(90deg, transparent, rgba(250,250,248,.35), transparent);
    animation: cardShine .9s ease-out 1550ms both; pointer-events: none; }

  @keyframes cardSpinIn {
    0% { transform: rotateY(-180deg) translateZ(80px) scale(.55); opacity: 0; }
    12% { transform: rotateY(-150deg) translateZ(70px) scale(.62); opacity: 1; }
    55% { transform: rotateY(14deg) translateZ(0px) scale(1.05); }
    78% { transform: rotateY(-8deg) translateZ(0px) scale(1); }
    100% { transform: rotateY(0deg) translateZ(0px) scale(1); opacity: 1; }
  }
  @keyframes cardSpinIn2D {
    0% { transform: scale(.55); opacity: 0; }
    12% { opacity: 1; }
    60% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes cardShine {
    0% { transform: translateX(-120%) skewX(-18deg); opacity: 0; }
    15% { opacity: .7; }
    100% { transform: translateX(260%) skewX(-18deg); opacity: 0; }
  }
  @keyframes starBurst {
    0% { transform: translate(0,0) scale(.3) rotate(0deg); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1) rotate(140deg); opacity: 0; }
  }
  @keyframes cardShadowIn {
    0% { transform: translateX(34px) translateY(46px) scale(.5); opacity: 0; }
    55% { transform: translateX(12px) translateY(16px) scale(1.04); opacity: .5; }
    100% { transform: translateX(0) translateY(10px) scale(1); opacity: .35; }
  }
  @keyframes scaleIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
  <h1>EvolveCard Safari-Diagnose</h1>
  <p>Drei Varianten nacheinander testen – jede läuft 4 Sekunden:</p>
  <button onclick="run('d3', false)">1) Original (mit backdrop-blur, 3D)</button>
  <button onclick="run('d3', true)">2) Ohne backdrop-blur (3D)</button>
  <button onclick="run('d2', false)">3) 2D-Fallback</button>
  <pre id="log">–</pre>

  <div id="overlay" class="overlay" style="display:none">
    <div class="persp">
      <span class="star" style="--dx:90px; --dy:-90px">★</span>
      <span class="star" style="--dx:-80px; --dy:-70px; animation-delay:995ms">★</span>
      <span class="star" style="--dx:60px; --dy:-40px; animation-delay:1040ms">★</span>
      <span class="shadow" id="shadow"></span>
      <div class="card" id="card" role="status">
        <span class="shine"></span>
        <div style="font-size:19px; font-weight:700">Test Parfum</div>
        <div style="font-size:12px; color:#D8D4FA; margin-top:3px">Diagnose-Haus</div>
      </div>
    </div>
  </div>

  <script>
    const log = document.getElementById('log');
    const rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    log.textContent = 'prefers-reduced-motion: ' + rm + '\n';

    function run(mode, noBlur) {
      const overlay = document.getElementById('overlay');
      const card = document.getElementById('card');
      const shadow = document.getElementById('shadow');
      overlay.classList.toggle('noblur', noBlur);
      overlay.style.display = 'flex';
      shadow.style.display = mode === 'd3' ? '' : 'none';

      // Klassen zurücksetzen + Reflow erzwingen, damit Animation neu startet
      card.classList.remove('reduced', 'd3', 'd2');
      void card.offsetWidth;
      card.classList.add(mode === 'reduced' ? 'reduced' : mode);

      // Live-Messung: Transform nach 700ms (mitten im Flip) und nach 2s (Ende)
      log.textContent = 'Variante: ' + mode + (noBlur ? ' (ohne Blur)' : '') + '\n';
      setTimeout(() => {
        const t1 = getComputedStyle(card).transform;
        log.textContent += 'Transform @700ms: ' + t1 + '\n';
      }, 700);
      setTimeout(() => {
        const t2 = getComputedStyle(card).transform;
        const anim = getComputedStyle(card).animationName;
        log.textContent += 'Transform @2s: ' + t2 + '\n';
        log.textContent += 'animationName: ' + anim + '\n';
        log.textContent += (t2 === 'none' || anim === 'none')
          ? '→ PROBLEM: Animation läuft nicht.'
          : '→ Animation läuft. Wenn du nichts siehst: Rendering-Problem (Screenshot vergleichen).';
        setTimeout(() => overlay.style.display = 'none', 2500);
      }, 2000);
    }
  </script>
</body>
</html>
